# SOLOServis en local con la arquitectura consolidada (TAL-109): PostgreSQL,
# los 3 procesos de dominio y el scraper. Es la misma topología "dominios" de
# Kubernetes (k8s/components/dominios).
#
#   docker compose -f docker/compose.yml up -d --build
#
# Los 3 procesos usan UNA imagen (docker/all-apis/Dockerfile, cmd/all-apis) y
# solo cambia API_DOMAIN:
#   comercial  = product, store, service, pricing, search, comparison,
#                favorites, cart, review, watchlist y notification (11 APIs)
#   usuarios   = auth y user
#   ingestion  = ingestion
#
# Cada proceso escucha en 8080 dentro de la red de Compose. Hacia tu máquina se
# publican los puertos históricos de cada API (8081-8094), todos apuntando al
# proceso de su dominio: el frontend (`pnpm dev`) y cualquier .env existente
# siguen funcionando sin cambios.
#
# El modo anterior (un contenedor por API) queda en compose.microservicios.yml.
# No levantar los dos a la vez: comparten puertos y el contenedor de PostgreSQL.

# Lo común a los 3 procesos de dominio.
x-dominio: &dominio
  build:
    context: ../backend
    dockerfile: ../docker/all-apis/Dockerfile
  image: soloservis/backend:local
  restart: unless-stopped
  healthcheck:
    # /health hace ping a PostgreSQL: sano solo si hay base de datos.
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5

x-dominio-env: &dominio-env
  PORT: "8080"
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/soloservis
  FRONTEND_URL: http://localhost:8443
  # Credencial de DESARROLLO, solo para Compose local.
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-solo-para-compose-local}

services:
  postgres:
    image: postgres:18
    container_name: soloservis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soloservis
      PGHOST: /var/run/postgresql
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: soloservis
      MIGRATIONS_DIR: /migrations
      MIGRATION_ORDER_FILE: /migration_order.txt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../backend/database/migrations:/migrations:ro
      - ../backend/database/migration_order.txt:/migration_order.txt:ro
      - ../k8s/base/migrations/migrate.sh:/docker-entrypoint-initdb.d/001_migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soloservis"]
      interval: 5s
      timeout: 5s
      retries: 10

  comercial:
    <<: *dominio
    container_name: soloservis_comercial
    environment:
      <<: *dominio-env
      API_DOMAIN: comercial
    ports:
      - "8081:8080" # product
      - "8082:8080" # store
      - "8083:8080" # service
      - "8085:8080" # pricing
      - "8086:8080" # search
      - "8087:8080" # comparison
      - "8089:8080" # favorites
      - "8090:8080" # cart
      - "8091:8080" # review
      - "8092:8080" # watchlist
      - "8093:8080" # notification
    depends_on:
      postgres:
        condition: service_healthy

  usuarios:
    <<: *dominio
    container_name: soloservis_usuarios
    environment:
      <<: *dominio-env
      API_DOMAIN: usuarios
    ports:
      - "8084:8080" # user
      - "8088:8080" # auth
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    <<: *dominio
    container_name: soloservis_ingestion
    environment:
      <<: *dominio-env
      API_DOMAIN: ingestion
      # notification vive en otro dominio: sin esta URL el proceso no arranca.
      NOTIFICATION_API_URL: http://comercial:8080
    ports:
      - "8094:8080" # ingestion
    depends_on:
      postgres:
        condition: service_healthy
      comercial:
        condition: service_healthy

  scraper:
    build:
      context: ..
      dockerfile: docker/scraper/Dockerfile
    container_name: soloservis_scraper
    restart: unless-stopped
    environment:
      SCRAPER_DATA_DIR: /data
      SCRAPER_STORES_DIR: /app/stores
      SCRAPER_API_PORT: "8095"
      SCRAPER_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-solo-para-compose-local}
      SCRAPER_RATE_LIMIT: 120/min
      INGESTION_API_URL: http://ingestion:8080
      INGESTION_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-solo-para-compose-local}
    ports:
      - "8095:8095"
    volumes:
      - scraper_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      ingestion:
        condition: service_healthy

volumes:
  postgres_data:
  scraper_data:
