services:
  postgres:
    image: postgres:18
    container_name: soloservis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: soloservis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ../backend/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d soloservis"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-api:
    build:
      context: ../backend
      dockerfile: ../docker/product-api/Dockerfile
    container_name: soloservis_product_api
    restart: unless-stopped
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/soloservis
      FRONTEND_URL: http://localhost:8443
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  store-api:
