# Cabeceras de seguridad del gateway (TAL-197, hallazgo H7 de TAL-195).
#
# Se incluye a nivel server y otra vez en cada location que tiene su propio
# add_header: en nginx un add_header dentro de una location anula todos los
# heredados del server. `always` las envía también en errores (4xx, 5xx).
#
# Strict-Transport-Security no va aquí: TLS termina en el Ingress de UCT, que
# ya la agrega (max-age=31536000; includeSubDomains). Repetirla la duplicaría.

# El navegador no adivina el tipo de un archivo: un JSON no se ejecuta como script.
add_header X-Content-Type-Options "nosniff" always;

# Nadie puede mostrar el sitio dentro de un iframe (clickjacking). Es la versión
# antigua de frame-ancestors 'none' de la CSP; se dejan las dos.
add_header X-Frame-Options "DENY" always;

# A otros sitios solo se les envía el origen, nunca la ruta con la búsqueda.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# La app no usa cámara, micrófono, ubicación ni pagos del navegador.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content-Security-Policy: de dónde puede cargar cada cosa el navegador.
#   script-src 'self'   solo el bundle de Vite servido por este nginx; un
#                       <script> inyectado (XSS) o de otro dominio no corre.
#   style-src           el CSS propio, Google Fonts y los estilos en línea que
#                       usan React y recharts.
#   font-src            las fuentes de Google (Outfit y JetBrains Mono).
#   img-src https:      las imágenes vienen de los CDN de cada tienda y los
#                       logos de favicon.ico o de google.com/s2/favicons.
#   connect-src 'self'  las APIs van por el mismo origen (VITE_*_API_URL vacías).
#   frame-ancestors     igual que X-Frame-Options: DENY.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
