server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Probe de Kubernetes (no toca las APIs).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # APIs del MVP por el mismo origen. La plataforma UCT solo permite el path /
    # por hostname en el Ingress, asi que el enrutamiento por path se hace aqui:
    # Browser -> Ingress (/) -> frontend (nginx) -> Service de cada API.
    # Los nombres coinciden con los Services de k8s y con docker/compose.yml.
    location ~ ^/products(/.*)?$ {
        # Publicamente solo lectura: el frontend solo hace GET a estas APIs.
        limit_except GET { deny all; }
        proxy_pass http://product-api:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ~ ^/stores(/.*)?$ {
        # Publicamente solo lectura: el frontend solo hace GET a estas APIs.
        limit_except GET { deny all; }
        proxy_pass http://store-api:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Assets con hash de Vite: cache largo.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: cualquier otra ruta sirve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
