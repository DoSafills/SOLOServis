# Cabeceras y tiempos comunes a todas las APIs (incluido desde default.conf.template).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Mismo id que registra el gateway (map de default.conf.template, TAL-251):
# el backend lo adopta como request_id y lo devuelve en X-Request-ID.
proxy_set_header X-Request-ID $soloservis_request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;

# Las cabeceras de seguridad las pone el gateway (soloservis-security-headers.conf).
# Si una API también envía alguna, se descarta la suya para no duplicarla.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Content-Security-Policy;

# Límite general por IP para todas las APIs (TAL-201): 30 por segundo con
# ráfaga de 60, holgado para cargar una página con varias llamadas.
limit_req zone=api burst=60 nodelay;
