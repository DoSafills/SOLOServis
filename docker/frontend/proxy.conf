# Cabeceras y tiempos comunes a todas las APIs (incluido desde default.conf.template).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;

# Límite general por IP para todas las APIs (TAL-201): 30 por segundo con
# ráfaga de 60, holgado para cargar una página con varias llamadas.
limit_req zone=api burst=60 nodelay;
