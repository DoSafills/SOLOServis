# Modo consolidado (respaldo): las 14 APIs en un solo Deployment "backend" (cmd/all-apis).
# Sirve si la cuota no alcanza para los 3 dominios: postgres + backend + frontend = 3 pods y 4
# Services, dentro de la cuota (12 pods, 10 Services, 1 CPU / 1G de requests).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Los recursos de un componente no reciben las etiquetas de base: sin esta, la
# limpieza de la Fase 1 (part-of=soloservis) no los borraría al cambiar de topología.
labels:
  - pairs:
      app.kubernetes.io/part-of: soloservis
    includeSelectors: false
    includeTemplates: true

resources:
  - backend.yaml

# El nginx del frontend envía todas las rutas públicas al backend único.
patches:
  - target: {kind: Deployment, name: frontend}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - {name: PRODUCT_UPSTREAM, value: "backend:8080"}
          - {name: STORE_UPSTREAM, value: "backend:8080"}
          - {name: SERVICE_UPSTREAM, value: "backend:8080"}
          - {name: AUTH_UPSTREAM, value: "backend:8080"}
          - {name: FAVORITES_UPSTREAM, value: "backend:8080"}
          - {name: CART_UPSTREAM, value: "backend:8080"}
          - {name: SEARCH_UPSTREAM, value: "backend:8080"}
          - {name: COMPARISON_UPSTREAM, value: "backend:8080"}
          - {name: REVIEW_UPSTREAM, value: "backend:8080"}
          - {name: WATCHLIST_UPSTREAM, value: "backend:8080"}
