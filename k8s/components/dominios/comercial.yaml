# comercial: product, store, service, pricing, search, comparison, favorites,
# cart, review, watchlist y notification. Las llamadas entre ellas van a
# 127.0.0.1:8080 (el binario las configura).
# Misma imagen que los otros dominios (cmd/all-apis); solo cambia API_DOMAIN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comercial
  labels:
    app.kubernetes.io/name: comercial
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Sin pod extra durante el rollout: en UCT la cuota casi no tiene margen.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: comercial
  template:
    metadata:
      labels:
        app.kubernetes.io/name: comercial
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: comercial
          image: soloservis/backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            # Qué APIs sirve este proceso (backend/internal/allapis/domains.go).
            - name: API_DOMAIN
              value: comercial
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: postgres-secret, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: postgres-secret, key: POSTGRES_DB}
            # DNS interno del Service "postgres" (mismo namespace). Nunca localhost.
            - name: DATABASE_URL
              value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef: {name: soloservis-config, key: FRONTEND_URL}
            # Token de servicio (scraper/admin). Lo crea el script de deploy;
            # sin él, las escrituras quedan solo para sesiones admin.
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef: {name: soloservis-internal, key: INTERNAL_API_TOKEN, optional: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          # /health hace ping a PostgreSQL: listo solo si hay base de datos.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness solo por TCP: una caída de la BD no debe reiniciar la API.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: comercial
  labels:
    app.kubernetes.io/name: comercial
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: comercial
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
