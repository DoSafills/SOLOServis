apiVersion: v1
kind: Pod
metadata:
  name: storage-test-pod
  namespace: student-rrios
spec:
  containers:
    - name: test
      image: alpine:3.22
      command:
        - sh
        - -c
        - sleep 3600
      volumeMounts:
        - name: storage
          mountPath: /data
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: storage-test
