# APIs adicionales al MVP inicial. Product y Store se mantienen en sus manifiestos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-api
  labels: {app.kubernetes.io/name: service-api, app.kubernetes.io/component: additional-api}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: service-api}}
  template:
    metadata: {labels: {app.kubernetes.io/name: service-api, app.kubernetes.io/component: additional-api}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: service-api
          image: soloservis/service-api
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8083}]
          env:
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_PASSWORD}}}
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: postgres-secret, key: POSTGRES_DB}}}
            - {name: DATABASE_URL, value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"}
            - {name: FRONTEND_URL, valueFrom: {configMapKeyRef: {name: soloservis-config, key: FRONTEND_URL}}}
            - {name: PORT, value: "8083"}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {tcpSocket: {port: http}, initialDelaySeconds: 10, periodSeconds: 20}
          resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 100m, memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
