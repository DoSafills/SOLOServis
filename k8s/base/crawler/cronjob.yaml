# Ejecución periódica del crawler (TAL-136/TAL-144).
#
# Un Job por disparo, nunca dos a la vez sobre el mismo PVC (RWO): el crawl
# abre una SCRAPE_RUN por fuente, exporta JSONL/JSON por ejecución y archiva el
# HTML en /data. La base SQLite también vive en el PVC, así que los runs
# sobreviven a la recreación del Pod.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper
  labels:
    app.kubernetes.io/name: scraper
    app.kubernetes.io/component: crawler
spec:
  # Diario a las 03:00 UTC. Ajusta el horario según la ventana de la tienda.
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scraper
            app.kubernetes.io/component: crawler
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: scraper
              image: soloservis/crawler:dev
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: scraper-config
              env:
                - name: HOME
                  value: /tmp
                - name: SCRAPER_DB_PATH
                  value: /data/scraper.db
                - name: SCRAPER_ITEMS_DIR
                  value: /data/items
                - name: SCRAPER_RAW_DIR
                  value: /data/raw
                - name: SCRAPER_REJECTS_DIR
                  value: /data/rejected
                - name: INGESTION_API_URL
                  valueFrom:
                    configMapKeyRef:
                      name: soloservis-config
                      key: INGESTION_API_URL
                      optional: true
                - name: INGESTION_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: soloservis-internal
                      key: INTERNAL_API_TOKEN
                      optional: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: bundle
                  mountPath: /etc/scraper
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: scraper-data
            # Bundle opcional (TAL-90): el operador lo crea desde un ejemplo con
            # `kubectl create configmap scraper-bundle --from-file=bundle.json=...`
            # y apunta SCRAPER_BUNDLE_PATH a /etc/scraper/bundle.json.
            - name: bundle
              configMap:
                name: scraper-bundle
                optional: true
            - name: tmp
              emptyDir: {}
