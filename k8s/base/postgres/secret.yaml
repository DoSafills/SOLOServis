# Credenciales de DESARROLLO (las mismas de docker/compose.yml).
# No usar en un entorno real: reemplazar por un Secret creado fuera de git.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: soloservis
