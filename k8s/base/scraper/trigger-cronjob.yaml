# The schedule no longer crawls. It only asks the API to start one run per
# store; the API queues them and the Deployment executes them one at a time.
# Idempotency-Key makes a retried job return the same run instead of a duplicate.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper-trigger
  labels:
    app.kubernetes.io/name: scraper-trigger
    app.kubernetes.io/component: scraper
spec:
  schedule: "0 3 * * *"
  timeZone: America/Santiago
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: scraper-trigger
            app.kubernetes.io/component: scraper
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trigger
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              env:
                - name: API_TOKEN
                  valueFrom:
                    secretKeyRef: {name: soloservis-internal, key: INTERNAL_API_TOKEN, optional: true}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  api="http://scraper-api:8095"
                  auth="Authorization: Bearer ${API_TOKEN}"
                  stores="$(curl -fsS -H "$auth" "$api/stores" \
                    | grep -o '"slug":"[^"]*"' | cut -d'"' -f4)"
                  if [ -z "$stores" ]; then
                    echo "no stores returned by $api/stores" >&2
                    exit 1
                  fi
                  for store in $stores; do
                    code="$(curl -sS -o /dev/null -w '%{http_code}' \
                      -X POST "$api/runs" \
                      -H "$auth" \
                      -H 'Content-Type: application/json' \
                      -H "Idempotency-Key: $(date +%Y%m%d)-$store" \
                      -d "{\"store\":\"$store\"}")"
                    case "$code" in
                      202|409) echo "$store: HTTP $code" ;;
                      *) echo "$store: unexpected HTTP $code" >&2; exit 1 ;;
                    esac
                  done
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
