# Pod de test: un Job que verifica el despliegue desde dentro del clúster y
# termina. Lo lanza la Fase 10 del deploy (o a mano, ver k8s/README.md). Solo
# lee: las escrituras que prueba se rechazan antes de llegar a la base.
#
# Tiene tres contenedores en el mismo pod:
#   smoke-test  curl con k8s/tests/smoke-test.sh: health, una lectura por API,
#               rutas protegidas, aislamiento entre dominios y el nginx.
#   origen      visor de llamadas (TAL-165/166/167): corre los escenarios y
#               muestra lo que envía y lo que le vuelve.
#   destino     sidecar (proxy) del visor: muestra lo que recibe cada servicio
#               y lo que responde antes de devolverlo a origen.
# El visor se mira en dos terminales:
#   kubectl logs -f job/soloservis-smoke-test -c origen
#   kubectl logs -f job/soloservis-smoke-test -c destino
# El Job termina bien solo si smoke-test y origen salen con código 0.
# Los Jobs son inmutables: para repetirlo hay que borrarlo antes.
apiVersion: batch/v1
kind: Job
metadata:
  name: soloservis-smoke-test
  labels:
    app.kubernetes.io/name: smoke-test
    app.kubernetes.io/component: test
spec:
  backoffLimit: 0
  # El visor con PAUSA alta (scripts/testing/llamadas.py --pausa) tarda más
  # que el smoke test: 10 minutos dan margen a los dos.
  activeDeadlineSeconds: 600
  # Se borra solo una hora después de terminar.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke-test
        app.kubernetes.io/component: test
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # Sin las variables <SERVICE>_PORT que inyecta cada Service.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # Usuario curl_user de la imagen curlimages/curl. Los contenedores de
        # Python lo cambian por nobody (65534).
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      # destino es un sidecar nativo: arranca antes que los demás, origen espera
      # a que responda (startupProbe) y Kubernetes lo detiene cuando smoke-test
      # y origen terminan. No cuenta para el resultado del Job.
      initContainers:
        - name: destino
          image: python:3.13-alpine3.21
          restartPolicy: Always
          command: ["python", "-u", "/scripts/destino.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: visor
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /__listo
              port: visor
            periodSeconds: 1
            failureThreshold: 30
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # LimitRange de la plataforma: mínimo 25m CPU y 64Mi por contenedor.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: smoke-test
          image: curlimages/curl:8.11.1
          command: ["sh", "/scripts/smoke-test.sh"]
          env:
            # Token del scraper, para probar /ingestion/* con token (TAL-199).
            # El script nunca lo imprime.
            - name: SCRAPER_TOKEN
              valueFrom:
                secretKeyRef: {name: soloservis-scraper, key: SCRAPER_TOKEN, optional: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
        - name: origen
          image: python:3.13-alpine3.21
          command: ["python", "-u", "/scripts/origen.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPATH
              value: /scripts
            # Lo cambia scripts/testing/llamadas.py (--tickets, --pausa). En el
            # deploy la pausa es 0 para no alargar la Fase 10.
            - name: TICKETS
              value: "165,166,167"
            - name: PAUSA
              value: "0"
            # Token del scraper, para las rutas /ingestion/* y /runs del
            # scraper (TAL-199). Nunca se imprime.
            - name: SCRAPER_TOKEN
              valueFrom:
                secretKeyRef: {name: soloservis-scraper, key: SCRAPER_TOKEN, optional: true}
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: soloservis-smoke-test-script
