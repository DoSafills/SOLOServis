# Pod de test: un Job que corre k8s/tests/smoke-test.sh con curl dentro del
# clúster y termina. Solo lee: no escribe nada en la base. Lo lanza la Fase 10
# del deploy (o a mano, ver k8s/README.md). Los Jobs son inmutables: para
# repetirlo hay que borrarlo antes.
apiVersion: batch/v1
kind: Job
metadata:
  name: soloservis-smoke-test
  labels:
    app.kubernetes.io/name: smoke-test
    app.kubernetes.io/component: test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  # Se borra solo una hora después de terminar.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smoke-test
        app.kubernetes.io/component: test
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Usuario curl_user de la imagen curlimages/curl.
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke-test
          image: curlimages/curl:8.11.1
          command: ["sh", "/scripts/smoke-test.sh"]
          env:
            # Para probar una ruta interna (ADMIN). El script nunca lo imprime.
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef: {name: soloservis-internal, key: INTERNAL_API_TOKEN, optional: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # LimitRange de la plataforma: mínimo 25m CPU y 64Mi por contenedor.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: soloservis-smoke-test-script
