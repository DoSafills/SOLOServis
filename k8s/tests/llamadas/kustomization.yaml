# Visor de llamadas del pod de test. Se aplica aparte de la app
# y del smoke test de la fase 10:
#   kubectl apply -k k8s/tests/llamadas
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: soloservis
    includeSelectors: false
    includeTemplates: true

resources:
  - job.yaml

configMapGenerator:
  - name: soloservis-llamadas-scripts
    files:
      - origen.py
      - destino.py
      - escenarios.py
    options:
      labels:
        app.kubernetes.io/component: test
