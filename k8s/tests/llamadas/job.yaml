# Visor de llamadas del pod de test: un Job con dos contenedores.
#   origen   corre los escenarios y muestra lo que envía y lo que le vuelve.
#   destino  sidecar (proxy) que muestra lo que recibe cada servicio y lo que
#            responde antes de devolverlo a origen.
# Cada uno se mira en su propia terminal:
#   kubectl logs -f job/soloservis-llamadas -c origen
#   kubectl logs -f job/soloservis-llamadas -c destino
# Solo lee: las escrituras que prueba se rechazan antes de llegar a la base.
# Se aplica aparte de la app y del smoke test (kubectl apply -k
# k8s/tests/llamadas) o con scripts/testing/llamadas.py. Los Jobs son
# inmutables: para repetirlo hay que borrarlo antes.
apiVersion: batch/v1
kind: Job
metadata:
  name: soloservis-llamadas
  labels:
    app.kubernetes.io/name: visor-llamadas
    app.kubernetes.io/component: test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: visor-llamadas
        app.kubernetes.io/component: test
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # Sin las variables <SERVICE>_PORT que inyecta cada Service.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        # nobody en la imagen de Python Alpine.
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      # destino es un sidecar nativo: arranca antes que origen, origen espera a
      # que responda (startupProbe) y Kubernetes lo detiene cuando origen termina.
      initContainers:
        - name: destino
          image: python:3.13-alpine3.21
          restartPolicy: Always
          command: ["python", "-u", "/scripts/destino.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: visor
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /__listo
              port: visor
            periodSeconds: 1
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # LimitRange de la plataforma: mínimo 25m CPU y 64Mi por contenedor.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      containers:
        - name: origen
          image: python:3.13-alpine3.21
          command: ["python", "-u", "/scripts/origen.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPATH
              value: /scripts
            # Lo cambia scripts/testing/llamadas.py (--tickets, --pausa).
            - name: TICKETS
              value: "165"
            - name: PAUSA
              value: "0.4"
            # Para las rutas internas. Nunca se imprime.
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef: {name: soloservis-internal, key: INTERNAL_API_TOKEN, optional: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: soloservis-llamadas-scripts
