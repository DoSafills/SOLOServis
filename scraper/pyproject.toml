[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soloservis-scraper"
version = "2.0.0"
description = "Spec-first scraper for SOLOServis: versioned store specs, SQLite storage and a runtime control API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scrapling[fetchers]>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "jsonschema>=4",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
scraper = "scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
