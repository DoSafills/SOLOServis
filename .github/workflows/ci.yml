name: CI

# Puerta de calidad del repo. Cada job ejecuta el comando que documenta el
# arnés de agentes (AGENTS.md y .opencode/skills/): si divergen, esto falla.
#
# Los tests de integración de Go se omiten solos cuando no existe
# TEST_DATABASE_URL; no se levanta PostgreSQL en CI a propósito, porque cada
# corrida costaría minutos y las suites unitarias ya cubren el contrato.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Compilar
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...

  scraper:
    name: Scraper (pytest + ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml

      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: Pytest
        run: python -m pytest -q

  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fronted
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: fronted/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fronted/pnpm-lock.yaml

      - name: Instalar
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm format:check` queda fuera hasta que se resuelvan los CRLF
      # (AGENTS.md §13): hoy falla por archivos ajenos a cualquier PR.
      - name: Build
        run: pnpm build

  skills:
    name: Skills sincronizados
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verificar espejo .opencode / .claude
        run: |
          if [ -x scripts/check-skills.sh ]; then
            ./scripts/check-skills.sh
          else
            echo "::warning::scripts/check-skills.sh no existe todavía (TAL-236); se omite."
          fi

  compose:
    name: Docker Compose válido
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Topología de dominios
        run: docker compose -f docker/compose.yml config --quiet

      - name: Topología de microservicios
        run: docker compose -f docker/compose.microservicios.yml config --quiet
